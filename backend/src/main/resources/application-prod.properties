# Activate with SPRING_PROFILES_ACTIVE=prod only after applying and verifying DB migrations.
# Production must never inherit local credentials, localhost CORS origins, or the VNPAY sandbox URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Do not let Hibernate mutate a production schema. An incomplete schema must fail startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
google.client-id=${GOOGLE_CLIENT_ID}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.payment-url=${VNPAY_PAYMENT_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL}
teacher.application.fee-vnd=${TEACHER_APPLICATION_FEE_VND}
