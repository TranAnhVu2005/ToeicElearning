# Activate with SPRING_PROFILES_ACTIVE=prod only after applying and verifying DB migrations.
# Production must never inherit local credentials, localhost CORS origins, or the VNPAY sandbox URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Do not let Hibernate mutate a production schema by default. Override with JPA_DDL_AUTO=update if initializing schema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
google.client-id=${GOOGLE_CLIENT_ID:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.api-base-url=${PAYOS_API_BASE_URL:https://api-merchant.payos.vn}
payos.frontend-result-url=${PAYOS_FRONTEND_RESULT_URL:${FRONTEND_URL:http://localhost:5173}/payment/result}
teacher.application.fee-vnd=${TEACHER_APPLICATION_FEE_VND:2000}

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:465}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
