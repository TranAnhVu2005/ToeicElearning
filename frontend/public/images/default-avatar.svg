<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>
  
  <!-- Body/Shirt -->
  <path d="M25,120 C25,95 40,82 60,82 C80,82 95,95 95,120 Z" fill="url(#shirtGrad)"/>
  <!-- Collar -->
  <polygon points="50,82 60,94 70,82" fill="#ffffff" opacity="0.9"/>

  <!-- Neck -->
  <rect x="52" y="70" width="16" height="15" rx="4" fill="#fdba74"/>

  <!-- Head -->
  <ellipse cx="60" cy="56" rx="24" ry="26" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="36" cy="56" r="6" fill="#fdba74"/>
  <circle cx="84" cy="56" r="6" fill="#fdba74"/>

  <!-- Hair Base -->
  <path d="M36,50 C34,28 45,22 60,22 C75,22 86,28 84,50 C80,36 72,32 60,32 C48,32 40,36 36,50 Z" fill="url(#hairGrad)"/>
  <path d="M36,42 C38,32 50,30 56,36 C50,38 42,42 36,42 Z" fill="url(#hairGrad)"/>

  <!-- Cute Eyes -->
  <ellipse cx="50" cy="54" rx="3.5" ry="4.5" fill="#1e293b"/>
  <ellipse cx="70" cy="54" rx="3.5" ry="4.5" fill="#1e293b"/>
  <!-- Eye highlights -->
  <circle cx="51.5" cy="52.5" r="1.5" fill="#ffffff"/>
  <circle cx="71.5" cy="52.5" r="1.5" fill="#ffffff"/>

  <!-- Cheeks blush -->
  <ellipse cx="45" cy="62" rx="4" ry="2.5" fill="#fb7185" opacity="0.55"/>
  <ellipse cx="75" cy="62" rx="4" ry="2.5" fill="#fb7185" opacity="0.55"/>

  <!-- Happy Smile -->
  <path d="M53,64 Q60,72 67,64" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Cute Eyebrows -->
  <path d="M46,47 Q50,45 54,47" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M66,47 Q70,45 74,47" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
</svg>
